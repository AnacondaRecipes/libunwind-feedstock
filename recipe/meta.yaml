{% set name = "libunwind" %}
{% set version = "1.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: http://download.savannah.nongnu.org/releases/libunwind/libunwind-{{ version }}.tar.gz
  sha256: 90337653d92d4a13de590781371c604f9031cdb50520366aa1e3a91e1efb1017 
  patches:
    - patches/lib64.patch

build:
  number: 1 
  run_exports:
    # breaks backwards compatibility sometimes but we trust the maintainers that they were only internal
    # https://abi-laboratory.pro/index.php?view=timeline&l=libunwind
    - {{ pin_subpackage('libunwind', max_pin='x') }}
  skip: true                    # [not linux]
  missing_dso_whitelist:        # [linux]
    - "*/libc.so.6"             # [linux]
    - "*/ld-linux-x86-64.so.2"  # [linux]
    - "*/ld-linux-aarch64.so.1" # [linux]

requirements:
  host:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - make
    - autoconf
    - automake
    - libtool
    - patch

test:
  commands:
    - test -f "${PREFIX}/lib/libunwind.so"
    - test ! -f "${PREFIX}/lib/libunwind.a"
    - test -f "${PREFIX}/include/libunwind.h"
    - test -f "${PREFIX}/include/unwind.h"

about:
  home: http://www.nongnu.org/libunwind
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: 'Defines a portable and efficient C programming interface (API) to determine the call-chain of a program'
  doc_url: http://www.nongnu.org/libunwind/docs.html
  dev_url: https://github.com/libunwind/libunwind

extra:
  recipe-maintainers:
    - synapticarbors
    - xhochy
    - matthiasdiener
